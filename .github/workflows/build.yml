name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "\/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "\/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "\/licenses/android-sdk-preview-license"
      - name: Install required SDK packages
        run: |
          yes | \/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
      - run: gradle wrapper --gradle-version 8.2
      - run: echo "sdk.dir=\" > local.properties
      - run: gradle clean assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: UnifiedBackupApp-APK, path: app/build/outputs/apk/debug/app-debug.apk }
